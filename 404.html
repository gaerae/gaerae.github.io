<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>페이지를 찾을 수 없습니다 · 개래닷컴</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#01020a">
  <meta http-equiv="refresh" content="6; url=/">

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #e9f0f8; --dim: #9aabc0; --faint: #61718a; --accent: #7cc4ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Pretendard Variable", "Pretendard", -apple-system, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 620px at 80% 26%, rgba(34, 66, 128, 0.38), transparent 60%),
        radial-gradient(720px 520px at 18% 82%, rgba(64, 44, 120, 0.20), transparent 60%),
        #01020a;
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      position: relative; overflow: hidden; word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }
    /* 은은한 별 */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.6;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 24%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 28% 66%, rgba(255,255,255,.5), transparent),
        radial-gradient(1.5px 1.5px at 46% 18%, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 62% 78%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 8% 84%, rgba(255,255,255,.45), transparent),
        radial-gradient(1.5px 1.5px at 88% 60%, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 74% 34%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 36% 92%, rgba(255,255,255,.4), transparent);
    }
    /* 발광 행성 (우상단, 사이트 모티프) */
    body::after {
      content: ""; position: fixed; right: -140px; top: -110px;
      width: 460px; height: 460px; border-radius: 50%; pointer-events: none; opacity: 0.55;
      background: radial-gradient(circle at 38% 34%, #d6ebff, #7cc4ff 26%, #2a4680 55%, rgba(10,16,36,0) 72%);
      filter: blur(1px);
    }

    .brand {
      position: fixed; top: 22px; left: 28px; z-index: 2;
      display: flex; align-items: center; gap: 9px; text-decoration: none;
      font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 16px; color: var(--ink);
    }
    .brand .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--accent) 60%, #4a58c8);
      box-shadow: 0 0 14px var(--accent);
    }

    .wrap { position: relative; z-index: 2; padding: 24px; }
    .code {
      font-family: "Space Grotesk", sans-serif; font-weight: 700;
      font-size: clamp(96px, 22vw, 224px); line-height: 1; letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff, #cfe6ff 55%, #86b6e6);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 44px rgba(120, 180, 255, 0.35));
    }
    h1 {
      font-weight: 700; font-size: clamp(20px, 3.4vw, 30px);
      letter-spacing: -0.01em; margin-top: 12px;
    }
    p { color: var(--dim); margin-top: 16px; font-size: clamp(14px, 1.6vw, 16px); line-height: 1.75; }
    .btn {
      display: inline-block; margin-top: 34px; padding: 13px 28px; border-radius: 100px;
      font-size: 14px; font-weight: 600; letter-spacing: 0.01em; color: #060814; text-decoration: none;
      background: linear-gradient(135deg, rgba(124,196,255,.96), rgba(79,143,240,.96));
      transition: transform .25s, box-shadow .25s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 44px rgba(90, 165, 255, 0.45); }
  </style>
</head>
<body>
  <a class="brand" href="/"><span class="dot"></span>gaerae.com</a>

  <main class="wrap">
    <div class="code">404</div>
    <h1>이 좌표엔 아무것도 없습니다</h1>
    <p>찾으시는 페이지를 찾을 수 없어요.<br>잠시 후 자동으로 홈으로 이동합니다.</p>
    <a class="btn" href="/">홈으로 돌아가기</a>
  </main>
</body>
</html>
