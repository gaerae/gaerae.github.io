<!-- 우주 씬 -->
<script type="module" src="assets/space.js?v=164d928561"></script>

<!-- UI 인터랙션 -->
<script>
  // WebGL 미지원 폴백
  if (!window.WebGLRenderingContext) document.body.classList.add('no-webgl');

  // 연도 자동 갱신
  document.getElementById('year').textContent = new Date().getFullYear();

  // 우주 · 기술 · 삶에 관한 문구 (랜덤 순환)
  // 출처를 확인한 것만 둔다 — 유명해도 근거 없는 귀속은 넣지 말 것. 괄호 안은 1차 출처.
  const QUOTES = [
    { q: '한 사람에게는 작은 걸음<br>인류에게는 거대한 도약', who: 'Neil Armstrong' },              // 아폴로 11, 1969
    { q: '쉬워서가 아니라 어렵기에<br>달에 가기로 했다', who: 'John F. Kennedy' },                  // 라이스대 연설, 1962
    { q: '저 점이 바로 여기다<br>우리의 집, 바로 우리다', who: 'Carl Sagan' },                     // 창백한 푸른 점, 1994
    { q: '행성은 지성의 요람이지만<br>요람에서 영원히 살 수 없다', who: 'Konstantin Tsiolkovsky' }, // 1911~12
    { q: '내가 더 멀리 보았다면<br>거인의 어깨 위에 섰기 때문', who: 'Isaac Newton' },          // 후크에게 보낸 편지, 1675
    { q: '만들 수 없다면<br>이해한 것이 아니다', who: 'Richard Feynman' },                         // 마지막 칠판, 1988
    { q: '충분히 발달한 기술은<br>마법과 구별할 수 없다', who: 'Arthur C. Clarke' },               // Science 기고, 1968
    { q: '미래를 예측하는 최선의 길은<br>미래를 발명하는 것이다', who: 'Alan Kay' },             // Xerox PARC, 1971
    { q: '말은 쉽다<br>코드를 보여 달라', who: 'Linus Torvalds' },                                 // LKML, 2000
    { q: '단순함은<br>신뢰성의 전제 조건이다', who: 'Edsger W. Dijkstra' },                        // EWD498, 1975
    { q: '더할 것이 없을 때가 아니라<br>뺄 것이 없을 때 완벽해진다', who: 'Antoine de Saint-Exupéry' }, // 인간의 대지, 1939
    { q: '당신의 시간은 한정돼 있다<br>남의 삶을 살며 낭비하지 마라', who: 'Steve Jobs' },        // 스탠퍼드 졸업 연설, 2005
    { q: '삶은 자전거 타기와 같다<br>균형을 잡으려면 나아가야 한다', who: 'Albert Einstein' }, // 아들에게 보낸 편지, 1930
    { q: '위대한 일은<br>작은 것들이 모여 이뤄진다', who: 'Vincent van Gogh' },                    // 테오에게 보낸 편지, 1882
    { q: '시작하는 방법은<br>말을 멈추고 행동하는 것이다', who: 'Walt Disney' },                   // 헤다 호퍼 인터뷰, 1957
    { q: '우리가 두려워할 것은<br>두려움 그 자체뿐이다', who: 'Franklin D. Roosevelt' },           // 취임 연설, 1933
    { q: '결코, 결코<br>굴복하지 마라', who: 'Winston Churchill' },                                // 해로 스쿨 연설, 1941
    { q: '천 리 길도<br>한 걸음에서 시작된다', who: 'Lao Tzu' },                                   // 도덕경 64장
    { q: '혼자서는 작지만<br>함께라면 많은 것을 이룬다', who: 'Helen Keller' },                    // Quote Investigator
    { q: '우리가 달라지면<br>세상의 흐름도 달라진다', who: 'Mahatma Gandhi' },                     // 1913
    { q: '가장 큰 영광은<br>넘어질 때마다 일어서는 것', who: 'Oliver Goldsmith' },                 // 세계 시민, 1760
    { q: '길을 따르지 않고<br>길 없는 곳에 자취를 남기리라', who: 'Muriel Strode' },               // Wind-Wafted Wild Flowers, 1903
    { q: '우리는 반복하는 행동으로<br>만들어진다', who: 'Will Durant' },                           // 철학 이야기, 1926
    { q: '삶은 다른 계획을 세우는<br>사이에 일어난다', who: 'Allen Saunders' },                    // Reader's Digest, 1957
    { q: '가진 것으로, 있는 자리에서<br>할 수 있는 것을 하라', who: 'Squire Bill Widener' },       // 시어도어 루스벨트 자서전, 1913
    { q: '사람들은 네 말은 잊어도<br>네가 준 느낌은 잊지 않는다', who: 'Carl W. Buehner' },        // Richard Evans' Quote Book, 1971
  ];
  const hl = document.getElementById('headline');
  const glow = hl.querySelector('.glow');
  const who = hl.querySelector('.who');
  let hi = Math.floor(Math.random() * QUOTES.length);
  const paint = () => { glow.innerHTML = QUOTES[hi].q; who.textContent = QUOTES[hi].who; };
  paint();
  requestAnimationFrame(() => hl.classList.add('show'));

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    setInterval(() => {
      hl.classList.remove('show');
      setTimeout(() => {
        let n; do { n = Math.floor(Math.random() * QUOTES.length); } while (n === hi);
        hi = n;
        paint();
        hl.classList.add('show');
      }, 620);
    }, 6500);
  }
</script>
