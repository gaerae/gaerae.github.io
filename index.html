<!-- UI 인터랙션 -->
<script>
  // WebGL 미지원 폴백
  if (!window.WebGLRenderingContext) document.body.classList.add('no-webgl');

  // 연도 자동 갱신
  document.getElementById('year').textContent = new Date().getFullYear();

  // 우주 · 기술 · 경이를 아우르는 유명인의 명언 (랜덤 순환)
  const QUOTES = [
    { q: '천천히 가도 좋다<br>멈추지만 않는다면', who: 'Confucius' },
    { q: '당신의 시간은 한정돼 있다<br>남의 삶을 사느라 낭비하지 마라', who: 'Steve Jobs' },
    { q: '넘어지지 않는 것이 아니라<br>넘어질 때마다 일어서는 것', who: 'Nelson Mandela' },
    { q: '미래는 꿈의 아름다움을<br>믿는 이의 것이다', who: 'Eleanor Roosevelt' },
    { q: '삶은 네가 다른 계획을 세우는<br>사이에 일어난다', who: 'John Lennon' },
    { q: '가진 것으로, 있는 자리에서<br>할 수 있는 것을 하라', who: 'Theodore Roosevelt' },
    { q: '시작하는 방법은<br>말을 멈추고 행동하는 것이다', who: 'Walt Disney' },
    { q: '길이 이끄는 곳이 아니라<br>길 없는 곳에 흔적을 남겨라', who: 'Ralph Waldo Emerson' },
    { q: '우리는 반복하는 행동으로<br>만들어진다', who: 'Aristotle' },
    { q: '세상에서 보고 싶은 변화<br>스스로 그 변화가 되어라', who: 'Mahatma Gandhi' },
    { q: '삶은 자전거를 타는 것과 같다<br>균형을 잡으려면 계속 나아가야 한다', who: 'Albert Einstein' },
    { q: '사람들은 네 말은 잊어도<br>네가 준 느낌은 잊지 않는다', who: 'Maya Angelou' },
    { q: '천 리 길도<br>한 걸음에서 시작된다', who: 'Lao Tzu' },
    { q: '결코, 결코<br>포기하지 마라', who: 'Winston Churchill' },
    { q: '혼자서는 작지만<br>함께라면 많은 것을 이룬다', who: 'Helen Keller' },
    { q: '위대한 일은<br>작은 것들이 모여 이뤄진다', who: 'Vincent van Gogh' },
    { q: '우리가 두려워할 것은<br>두려움 그 자체뿐이다', who: 'Franklin D. Roosevelt' },
    { q: '할 수 있다 믿든 없다 믿든<br>당신 말이 맞다', who: 'Henry Ford' },
    { q: '너 자신이 되어라<br>다른 사람은 이미 있으니', who: 'Oscar Wilde' },
    { q: '행복은 이미 있는 것이 아니라<br>당신의 행동에서 온다', who: 'Dalai Lama' },
  ];
  const hl = document.getElementById('headline');
  const glow = hl.querySelector('.glow');
  const who = hl.querySelector('.who');
  let hi = Math.floor(Math.random() * QUOTES.length);
  const paint = () => { glow.innerHTML = QUOTES[hi].q; who.textContent = QUOTES[hi].who; };
  paint();
  requestAnimationFrame(() => hl.classList.add('show'));

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    setInterval(() => {
      hl.classList.remove('show');
      setTimeout(() => {
        let n; do { n = Math.floor(Math.random() * QUOTES.length); } while (n === hi);
        hi = n;
        paint();
        hl.classList.add('show');
      }, 650);
    }, 5800);
  }
</script>
